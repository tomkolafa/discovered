<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080B0D" />
    <meta name="description" content="A live movement record for teams working together across terrain." />
    <link rel="icon" href="/icon.svg" />
    <title>Discovered — See every step</title>
    <!-- must be inline and blocking: sets the theme before first paint, mirrors getTheme() in src/lib/identity.ts -->
    <script>try{var t=localStorage.getItem('fl.theme');document.documentElement.dataset.theme=(t==='dark'||t==='light')?t:(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){}</script>
  </head>
  <body>
    <div id="landing-root"></div>
    <script type="module" src="/src/landing.tsx"></script>
  </body>
</html>
